# 将默认前缀 Ctrl+b 改为 Ctrl+a
unbind C-b
set -g prefix C-a
# 按前缀后按 a，发送原始前缀（嵌套 tmux 时用）
bind C-a send-prefix

# 窗口/pane 从 1 编号，关窗口后自动重排
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# 窗口名显示当前 pane 工作目录的最后一级，而不是运行中的命令名
set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"

# 开启鼠标支持：滚轮翻页、点击切换 pane、拖拽调整 pane 大小
set -g mouse on

# 同步刷新（DECSET 2026）：opencode 等 TUI 重绘时减少闪烁
set -as terminal-features ',*:sync'
# 明确启用 RGB，确保十六进制颜色不会被降级为 256 色。
set -as terminal-features ',*:RGB'

# 剪贴板：把应用发来的 OSC 52 转发到外层终端（系统剪贴板）
set -g set-clipboard on

# 顶部状态栏显示
set -g status on
set -g status-position top
set -g status-interval 1

# TokyoNight Storm：深蓝紫底色承载信息，紫色标识 session，
# 蓝色标识当前窗口，普通 window 使用低对比度蓝灰色。
set -g status-style "fg=#c0caf5,bg=#292e42"
set -g status-left-length 40
set -g status-right-length 40

# 使用普通文字和直角色块，不依赖 Powerline/Nerd Font 的装饰字符。
set -g status-left "#[fg=#1f2335,bg=#bb9af7,bold] #S "
set -g status-right "#[fg=#8fbcbb,bg=#34405a] %Y-%m-%d  %H:%M:%S "

# 使用直接相连的实色块区分窗口，不使用边框字符、下划线或额外间距。
set -g window-status-separator ""
setw -g window-status-style "fg=#c0caf5,bg=#292e42"
setw -g window-status-format "#[fg=#c0caf5,bg=#3b4261] #I:#W "

# 当前窗口用 TokyoNight 蓝色块高亮。
setw -g window-status-current-style "fg=#1f2335,bg=#7aa2f7,bold"
setw -g window-status-current-format "#[fg=#1f2335,bg=#7aa2f7,bold] #I:#W "

# Pane 和提示信息沿用 TokyoNight 的层级。
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "fg=#1f2335,bg=#bb9af7,bold"
set -g message-command-style "fg=#1f2335,bg=#7dcfff,bold"
set -g mode-style "fg=#1f2335,bg=#e0af68,bold"
set -g display-panes-colour "#a9b1d6"
set -g display-panes-active-colour "#7aa2f7"

# 热重载配置：前缀 + r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# 用 Alt+hjkl 切换 pane
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# 拆分窗口：| 水平拆（左右），_ 垂直拆（上下）
bind | split-window -h -c '#{pane_current_path}'
bind _ split-window -v -c '#{pane_current_path}'

# 悬浮终端：一个持久 session 中，每个 workspace window 对应一个 popup window。
# run-shell 先在外层捕获格式变量，避免它们在 popup 内被重新解析。
bind -n C-t run-shell -b 'source_id=#{q:window_id}; source_name=#{q:window_name}; source_path=#{q:pane_current_path}; source_session=#{q:session_name}; source_client=#{q:client_tty}; if [ "$source_session" = popup-server ]; then tmux detach-client -t "$source_client"; exit; fi; popup_name="popup-$source_name"; if ! tmux has-session -t =popup-server 2>/dev/null; then popup_id=$(tmux new-session -d -s popup-server -n "$popup_name" -c "$source_path" -P -F "##{window_id}"); tmux set-window-option -t "$popup_id" @popup-source-window "$source_id"; else popup_id=$(tmux list-windows -t popup-server -F "##{@popup-source-window} ##{window_id}" | awk -v id="$source_id" '\''$1 == id { print $2; exit}'\''); if [ -z "$popup_id" ]; then popup_id=$(tmux new-window -d -t popup-server: -n "$popup_name" -c "$source_path" -P -F "##{window_id}"); tmux set-window-option -t "$popup_id" @popup-source-window "$source_id"; fi; fi; tmux display-popup -E -w 80% -h 80% -d "$source_path" "tmux select-window -t $popup_id; exec tmux attach-session -t popup-server"'

# popup 内 Escape 只 detach 当前 client，不销毁 popup-server session。
bind -n Escape if-shell -F '#{==:#{session_name},popup-server}' \
    'detach-client' \
    'send-keys Escape'

# copy-mode 用 vim 键位
setw -g mode-keys vi
unbind-key -T copy-mode-vi v
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi 'C-v' send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# 智能 pane 切换：pane 里是 vim 时把按键传给 vim，否则 tmux 切 pane
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\' 'select-pane -l'

# copy-mode 里也能用 C-hjkl 切 pane
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# 切换窗口/pane（焦点变化）时执行自定义命令
set-hook -g window-pane-changed 'run-shell "/mnt/c/AIMSwitcher.exe --imm 0"'

# 垂直分割（Ctrl+b %）自动进入当前路径
bind % split-window -h -c "#{pane_current_path}"

# 水平分割（Ctrl+b "）自动进入当前路径
bind '"' split-window -v -c "#{pane_current_path}"

# 新建窗口（Ctrl+b c）自动进入当前路径
bind c new-window -c "#{pane_current_path}"
